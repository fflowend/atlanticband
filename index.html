<body>
<div class="auth" id="auth"><div class="authbox"><div class="authlogo">Flowy</div><h1 id="authTitle">Akışına katıl.</h1><p>Fotoğraf, kısa video, story ve mesajlarla kendi sosyal alanını oluştur. Bu sürüm cihazında kalıcı çalışan demo uygulamadır.</p><div class="form" style="padding:10px 0 0"><input id="authName" class="field" placeholder="Adın"/><input id="authUser" class="field" placeholder="Kullanıcı adı"/><input id="authPass" class="field" type="password" placeholder="Şifre"/><button class="primary" onclick="doAuth()">Devam et</button><button class="secondary" onclick="demoLogin()">Demo hesaba gir</button></div><div class="authswitch" id="authSwitch" onclick="toggleAuth()">Zaten hesabın var mı? Giriş yap</div></div></div>
<div class="app" id="app">
<header class="top"><div class="logo">Flowy</div><div class="actions"><button class="iconbtn" onclick="openNotifications()"><span class="dot" id="notifDot"></span><svg class="ico"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6a5.5 5.5 0 0 0 1-8.8z"/></svg></button><button class="iconbtn" onclick="go('inbox')"><svg class="ico"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4Z"/></svg></button></div></header>
<main>
<section class="page active" id="home"><div class="stories" id="stories"></div><div id="feed"></div></section>
<section class="page" id="explore"><div class="search"><svg class="ico" style="width:18px"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="searchInput" placeholder="Ara: kişi, mekan, konu" oninput="renderExplore()"/></div><div class="chips"><button class="chip active">Sana özel</button><button class="chip">Müzik</button><button class="chip">Kahve</button><button class="chip">Moda</button><button class="chip">Seyahat</button></div><div class="grid" id="exploreGrid"></div></section>
<section class="page" id="reels"><div id="reelBox"></div></section>
<section class="page" id="inbox"><div class="section">Mesajlar <small onclick="newChat()">Yeni mesaj</small></div><div class="notes" id="notes"></div><div id="chats"></div></section>
<section class="page" id="profile"><div class="cover"></div><div class="profmain"><div class="profrow"><img class="profpic" id="profPic"/><div class="stats"><div class="stat"><b id="postCount">0</b>Gönderi</div><div class="stat"><b id="followerCount">0</b>Takipçi</div><div class="stat"><b id="followingCount">0</b>Takip</div></div></div><div class="pname" id="profName"></div><div class="handle" id="profHandle"></div><div class="bio" id="profBio"></div><div class="plink" id="profLink"></div><div class="profacts"><button onclick="openEditProfile()">Profili düzenle</button><button onclick="shareProfile()">Profili paylaş</button><button onclick="logout()">⎋</button></div><div class="tabs"><button class="active">▦</button><button>▶</button><button>♙</button></div></div><div class="pgrid" id="profileGrid"></div></section>
</main>
<nav class="bottom"><button class="nav active" data-p="home" onclick="go('home',this)"><svg class="ico"><path d="m3 11 9-8 9 8v10h-6v-6H9v6H3z"/></svg></button><button class="nav" data-p="explore" onclick="go('explore',this)"><svg class="ico"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button><button class="nav" onclick="openCreate()"><span class="plus">+</span></button><button class="nav" data-p="reels" onclick="go('reels',this)"><svg class="ico"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8 3 4 5 4-5M8 21l4-5 4 5"/></svg></button><button class="nav" data-p="profile" onclick="go('profile',this)"><svg class="ico"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-5 4-7 8-7s6.5 2 8 7"/></svg></button></nav>
</div>
<div class="overlay" id="sheet"><div class="sheet"><div class="shead"><button class="x" onclick="closeSheet()">×</button><b id="sheetTitle">Flowy</b><span style="width:24px"></span></div><div id="sheetBody"></div></div></div>
<div class="storyview" id="storyView"><div class="storycard"><img id="storyImage"/><div class="storygrad"></div><div class="prog"><i id="storyProg"></i></div><div class="storytop"><img id="storyAvatar"/><b id="storyUser"></b><button class="x" onclick="closeStory()">×</button></div><div class="storyreply"><input id="storyReply" placeholder="Yanıt gönder..."/><button onclick="sendStoryReply()">Gönder</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const seed={users:[

{uid:'u1',img:'https://images.unsplash.com/photo-1511081692775-05d0f180a065?auto=format&fit=crop&w=1000&q=85'},{uid:'u2',img:'https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?auto=format&fit=crop&w=1000&q=85'},{uid:'u3',img:'https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=1000&q=85'},{uid:'u4',img:'https://images.unsplash.com/photo-1449824913935-59a10b8d2000?auto=format&fit=crop&w=1000&q=85'}],

let db=JSON.parse(localStorage.getItem('flowy_db')||'null')||structuredClone(seed);let current=JSON.parse(localStorage.getItem('flowy_current')||'null');let authMode='register';let reelIndex=0;let activeStory=null;let uploadData='';
const $=id=>document.getElementById(id);const userBy=id=>[...(db.users||[]),current].filter(Boolean).find(x=>x.id===id);function save(){localStorage.setItem('flowy_db',JSON.stringify(db));if(current)localStorage.setItem('flowy_current',JSON.stringify(current))}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}function svg(name){const m={heart:'<svg class="ico"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6a5.5 5.5 0 0 0 1-8.8z"/></svg>',comment:'<svg class="ico"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg>',send:'<svg class="ico"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4Z"/></svg>',save:'<svg class="ico"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>'};return m[name]}
function toggleAuth(){authMode=authMode==='register'?'login':'register';$('authTitle').textContent=authMode==='register'?'Akışına katıl.':'Tekrar hoş geldin.';$('authName').classList.toggle('hidden',authMode==='login');$('authSwitch').textContent=authMode==='register'?'Zaten hesabın var mı? Giriş yap':'Hesabın yok mu? Kayıt ol'}
function doAuth(){const n=$('authName').value.trim(),u=$('authUser').value.trim().replace('@','').toLowerCase(),p=$('authPass').value;if(!u||!p||(authMode==='register'&&!n))return toast('Alanları tamamla');if(authMode==='register'){if((db.accounts||[]).some(a=>a.user===u))return toast('Bu kullanıcı adı alınmış');current={id:'me_'+Date.now(),name:n,user:u,pass:p,avatar:'https://i.pravatar.cc/200?u='+encodeURIComponent(u),bio:'Flowy’de yeni ✦',link:'flowy.app/'+u,followers:0,following:0};db.accounts=db.accounts||[];db.accounts.push(current);db.users.push(current);save();enter()}else{const a=(db.accounts||[]).find(a=>a.user===u&&a.pass===p);if(!a)return toast('Kullanıcı adı veya şifre yanlış');current=a;save();enter()}}
function demoLogin(){current={id:'me_demo',name:'Flowy Demo',user:'flowydemo',avatar:'https://i.pravatar.cc/200?u=flowydemo',bio:'yarat • paylaş • akışta kal ✦',link:'flowy.app/flowydemo',followers:128,following:64};if(!db.users.some(u=>u.id===current.id))db.users.push(current);save();enter()}
function enter(){$('auth').classList.add('hidden');renderAll()}function logout(){localStorage.removeItem('flowy_current');location.reload()}
function go(p,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(p).classList.add('active');document.querySelectorAll('.nav[data-p]').forEach(x=>x.classList.remove('active'));const b=btn||document.querySelector('.nav[data-p="'+p+'"]');if(b)b.classList.add('active');if(p==='profile')renderProfile();if(p==='explore')renderExplore();if(p==='reels')renderReel();if(p==='inbox')renderInbox();window.scrollTo(0,0)}
function renderStories(){const arr=[{uid:current.id,img:current.avatar,self:true},...db.stories];$('stories').innerHTML=arr.map((s,i)=>{const u=userBy(s.uid)||current;return `<div class="story" onclick="${s.self?'openStoryCreate()':'openStory('+ (i-1) +')'}"><div class="ring ${s.self?'selfring':''}"><img src="${u.avatar}">${s.self?'<i class="badgeplus">+</i>':''}</div><span>${s.self?'Hikâyen':'@'+u.user}</span></div>`}).join('')}
function renderFeed(){const posts=[...db.posts].reverse();$('feed').innerHTML=posts.map(p=>{const u=userBy(p.uid)||current;const own=p.uid===current.id;return `<article class="post"><div class="posthead"><img class="avatar" src="${u.avatar}"><div class="grow"><div class="username">${u.user}</div><div class="sub">${p.location||'Flowy'}</div></div>${own?'':`<button class="follow ${p.following?'on':''}" onclick="toggleFollow('${p.id}')">${p.following?'Takiptesin':'Takip et'}</button>`}</div><div class="mediawrap" ondblclick="toggleLike('${p.id}')"><img class="media ${p.tall?'tall':''}" src="${p.img}">${p.music?`<span class="music">♪ ${p.music}</span>`:''}</div><div class="postacts"><button class="iconbtn ${p.liked?'liked':''}" onclick="toggleLike('${p.id}')">${svg('heart')}</button><button class="iconbtn" onclick="openComments('${p.id}')">${svg('comment')}</button><button class="iconbtn" onclick="sharePost('${p.id}')">${svg('send')}</button><span class="spacer"></span><button class="iconbtn ${p.saved?'saved':''}" onclick="toggleSave('${p.id}')">${svg('save')}</button></div><div class="likes">${p.likes||0} beğenme</div><div class="cap"><b>${u.user}</b>${escapeHtml(p.caption||'')}</div><div class="viewcomments" onclick="openComments('${p.id}')">${(p.comments||[]).length} yorumun tümünü gör</div><div class="ptime">Şimdi</div></article>`}).join('')}
function toggleLike(id){const p=db.posts.find(x=>x.id===id);if(!p)return;p.liked=!p.liked;p.likes=(p.likes||0)+(p.liked?1:-1);save();renderFeed();toast(p.liked?'Beğenildi':'Beğeni kaldırıldı')}function toggleSave(id){const p=db.posts.find(x=>x.id===id);p.saved=!p.saved;save();renderFeed();toast(p.saved?'Kaydedildi':'Kayıttan çıkarıldı')}function toggleFollow(id){const p=db.posts.find(x=>x.id===id);p.following=!p.following;current.following=Math.max(0,(current.following||0)+(p.following?1:-1));save();renderFeed();toast(p.following?'Takip ediliyor':'Takip bırakıldı')}
function renderExplore(){const q=($('searchInput')?.value||'').toLowerCase();let arr=db.posts.filter(p=>{const u=userBy(p.uid);return !q||p.caption.toLowerCase().includes(q)||(u&&u.user.includes(q))||(p.location||'').toLowerCase().includes(q)});$('exploreGrid').innerHTML=arr.map(p=>`<div class="tile" onclick="openComments('${p.id}')"><img src="${p.img}"><small>♡ ${p.likes||0}</small></div>`).join('')||'<div class="muted" style="padding:20px;grid-column:1/-1">Sonuç bulunamadı.</div>'}
function renderReel(){if(!db.reels.length)return;$('reelBox').innerHTML='';const r=db.reels[reelIndex%db.reels.length],u=userBy(r.uid)||current;$('reelBox').innerHTML=`<div class="reel" onclick="nextReel()"><img src="${r.img}"><div class="reelinfo"><div class="reeluser"><img src="${u.avatar}">@${u.user} <button class="follow">Takip et</button></div><p>${escapeHtml(r.caption)}</p><small>♪ Original flow</small></div><div class="reelside"><button onclick="event.stopPropagation();toast('Reel beğenildi')">${svg('heart')}${r.likes}</button><button onclick="event.stopPropagation();toast('Yorumlar açıldı')">${svg('comment')}128</button><button onclick="event.stopPropagation();shareText('Bu Reel’i paylaş')">${svg('send')}Paylaş</button></div></div>`}function nextReel(){reelIndex=(reelIndex+1)%db.reels.length;renderReel()}
function renderInbox(){const ns=[current,...db.users.filter(u=>u.id!==current.id).slice(0,4)];$('notes').innerHTML=ns.map(u=>`<div class="note"><img src="${u.avatar}"><div>${u.id===current.id?'Not bırak':'@'+u.user}</div></div>`).join('');$('chats').innerHTML=db.chats.map(c=>{const u=userBy(c.uid);if(!u)return'';return `<div class="chat" onclick="openChat('${u.id}')"><img src="${u.avatar}"><div class="grow"><div class="chatname">${u.name}</div><div class="chatlast">${c.last}</div></div>${c.unread?'<span class="unread"></span>':''}</div>`}).join('')}
function openChat(uid){const u=userBy(uid);openSheet(u.name,`<div class="comments" id="msgList"><div class="comment"><img src="${u.avatar}"><div><p><b>${u.user}</b> Merhaba 👋</p><small>şimdi</small></div></div></div><div class="form"><div class="row"><input id="msgInput" class="field" placeholder="Mesaj yaz..."><button class="primary" style="max-width:95px" onclick="sendMsg('${uid}')">Gönder</button></div></div>`)}function sendMsg(uid){const v=$('msgInput').value.trim();if(!v)return;const u=userBy(uid);$('msgList').innerHTML+=`<div class="comment" style="justify-content:flex-end"><div><p style="background:#6d45d9;padding:8px 10px;border-radius:12px">${escapeHtml(v)}</p><small>sen</small></div></div>`;$('msgInput').value='';let c=db.chats.find(c=>c.uid===uid);if(c)c.last=v;else db.chats.unshift({uid,last:v,unread:false});save()}
function newChat(){const u=db.users.find(x=>x.id!==current.id);if(u)openChat(u.id)}
function renderProfile(){$('profPic').src=current.avatar;$('profName').textContent=current.name;$('profHandle').textContent='@'+current.user;$('profBio').textContent=current.bio||'';$('profLink').textContent=current.link||'';const mine=db.posts.filter(p=>p.uid===current.id);$('postCount').textContent=mine.length;$('followerCount').textContent=current.followers||0;$('followingCount').textContent=current.following||0;$('profileGrid').innerHTML=mine.slice().reverse().map(p=>`<img src="${p.img}">`).join('')||'<div class="muted" style="padding:20px;grid-column:1/-1">Henüz gönderin yok. + ile oluştur.</div>'}
function openNotifications(){$('notifDot').classList.add('hidden');openSheet('Bildirimler',db.notifications.map(n=>{const u=userBy(n.uid);return `<div class="activity"><img src="${u.avatar}"><p><b>${u.user}</b> ${n.text}<br><small>${n.time}</small></p></div>`}).join(''))}
function openCreate(){openSheet('Yeni içerik',`<div class="form"><div class="row"><button class="secondary" onclick="setCreateType('post')">Gönderi</button><button class="secondary" onclick="setCreateType('reel')">Reel</button><button class="secondary" onclick="setCreateType('story')">Story</button></div><input type="file" accept="image/*" class="field" onchange="readUpload(event)"><div class="preview" id="uploadPreview">Fotoğraf seç</div><textarea id="newCaption" class="field" rows="3" placeholder="Bir şeyler yaz..."></textarea><input id="newLocation" class="field" placeholder="Konum"><input id="createType" type="hidden" value="post"><button class="primary" onclick="publish()">Paylaş</button><div class="muted">Fotoğraf cihazında tarayıcı verisi olarak saklanır. Büyük dosyalar localStorage sınırına takılabilir.</div></div>`)}function setCreateType(t){$('createType').value=t;toast(t==='post'?'Gönderi seçildi':t==='reel'?'Reel seçildi':'Story seçildi')}function readUpload(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{uploadData=r.result;$('uploadPreview').innerHTML=`<img src="${uploadData}">`};r.readAsDataURL(f)}function publish(){if(!uploadData)return toast('Önce fotoğraf seç');const t=$('createType').value,c=$('newCaption').value,l=$('newLocation').value;if(t==='post')db.posts.push({id:'p'+Date.now(),uid:current.id,img:uploadData,caption:c||'Yeni flow ✦',location:l||'Flowy',likes:0,comments:[]});if(t==='story')db.stories.unshift({uid:current.id,img:uploadData});if(t==='reel')db.reels.unshift({uid:current.id,img:uploadData,caption:c||'Yeni Reel',likes:0});uploadData='';save();closeSheet();renderAll();toast('Paylaşıldı ✦')}
function openStoryCreate(){openSheet('Story ekle',`<div class="form"><input type="file" accept="image/*" class="field" onchange="readUpload(event)"><div class="preview" id="uploadPreview">Story görseli seç</div><button class="primary" onclick="quickStory()">Story paylaş</button></div>`)}function quickStory(){if(!uploadData)return toast('Görsel seç');db.stories.unshift({uid:current.id,img:uploadData});uploadData='';save();closeSheet();renderStories();toast('Story paylaşıldı')}
function openStory(i){activeStory=db.stories[i];if(!activeStory)return;const u=userBy(activeStory.uid)||current;$('storyImage').src=activeStory.img;$('storyAvatar').src=u.avatar;$('storyUser').textContent='@'+u.user;$('storyProg').style.animation='none';void $('storyProg').offsetWidth;$('storyProg').style.animation='prog 5s linear forwards';$('storyView').classList.add('open');setTimeout(()=>{if($('storyView').classList.contains('open'))closeStory()},5000)}function closeStory(){$('storyView').classList.remove('open')}function sendStoryReply(){const v=$('storyReply').value.trim();if(v){toast('Yanıt gönderildi');$('storyReply').value='';closeStory()}}
function openComments(id){const p=db.posts.find(x=>x.id===id),u=userBy(p.uid);openSheet('Yorumlar',`<div class="comments">${(p.comments||[]).map(c=>`<div class="comment"><img src="https://i.pravatar.cc/100?u=${c.u}"><div><p><b>${c.u}</b> ${escapeHtml(c.t)}</p><small>şimdi</small></div></div>`).join('')||'<div class="muted">İlk yorumu sen yaz.</div>'}</div><div class="form"><div class="row"><input id="commentInput" class="field" placeholder="Yorum ekle..."><button class="primary" style="max-width:95px" onclick="addComment('${id}')">Gönder</button></div></div>`)}function addComment(id){const v=$('commentInput').value.trim();if(!v)return;const p=db.posts.find(x=>x.id===id);p.comments=p.comments||[];p.comments.push({u:current.user,t:v});save();closeSheet();renderFeed();toast('Yorum eklendi')}
function openEditProfile(){openSheet('Profili düzenle',`<div class="form"><input id="editName" class="field" value="${escapeAttr(current.name)}"><input id="editUser" class="field" value="${escapeAttr(current.user)}"><textarea id="editBio" class="field" rows="3">${escapeHtml(current.bio||'')}</textarea><input id="editLink" class="field" value="${escapeAttr(current.link||'')}"><input type="file" accept="image/*" class="field" onchange="readAvatar(event)"><button class="primary" onclick="saveProfile()">Kaydet</button></div>`)}function readAvatar(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{current.avatar=r.result};r.readAsDataURL(f)}function saveProfile(){current.name=$('editName').value.trim()||current.name;current.user=$('editUser').value.trim().replace('@','')||current.user;current.bio=$('editBio').value;current.link=$('editLink').value;const idx=db.users.findIndex(u=>u.id===current.id);if(idx>=0)db.users[idx]={...db.users[idx],...current};save();closeSheet();renderAll();toast('Profil güncellendi')}
function sharePost(id){shareText('Flowy gönderisi: '+location.href+'#'+id)}function shareProfile(){shareText('Flowy profilim: '+location.href+'#@'+current.user)}function shareText(t){if(navigator.share)navigator.share({title:'Flowy',text:t,url:location.href}).catch(()=>{});else navigator.clipboard?.writeText(t).then(()=>toast('Bağlantı kopyalandı'))}
function openSheet(title,html){$('sheetTitle').textContent=title;$('sheetBody').innerHTML=html;$('sheet').classList.add('open')}function closeSheet(){$('sheet').classList.remove('open')}function escapeHtml(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function escapeAttr(s=''){return escapeHtml(s).replace(/`/g,'&#96;')}
function renderAll(){renderStories();renderFeed();renderExplore();renderReel();renderInbox();renderProfile()}
if(current){$('auth').classList.add('hidden');renderAll()}
</script>
</body></html>
