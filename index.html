<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

<link rel="manifest" href="manifest.json" />
<title>Flowy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#08070b;--panel:#121018;--panel2:#1a1720;--line:#2c2734;--text:#fff;--muted:#9a94a5;--p:#8b5cf6;--pink:#ec4899;--danger:#ff5f7d}*{box-sizing:border-box}body{margin:0;background:#050406;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.app{width:min(100%,480px);min-height:100dvh;margin:auto;background:var(--bg);position:relative}.hidden{display:none!important}.top{height:62px;position:sticky;top:0;z-index:20;background:#08070bee;backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #ffffff0a}.logo{font-size:27px;font-weight:950;letter-spacing:-1.5px;background:linear-gradient(100deg,#fff,#c4b5fd,#f9a8d4);-webkit-background-clip:text;color:transparent}.icons{display:flex;gap:4px}.iconbtn,.nav,.plain{border:0;background:transparent;color:#fff;cursor:pointer}.iconbtn{padding:8px;border-radius:12px;font-size:21px}.page{display:none;padding-bottom:78px}.page.active{display:block}.bottom{position:fixed;bottom:0;z-index:30;width:min(100%,480px);height:66px;background:#08070bf2;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}.nav{color:#8f8998;font-size:23px}.nav.active{color:#fff}.create{width:39px;height:31px;border-radius:10px;display:inline-grid;place-items:center;background:linear-gradient(135deg,var(--p),var(--pink));color:#fff}.stories{display:flex;gap:12px;overflow:auto;padding:13px;border-bottom:1px solid #ffffff08;scrollbar-width:none}.story{min-width:68px;text-align:center;font-size:11px;cursor:pointer}.ring{width:64px;height:64px;padding:2.5px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#ec4899,#f59e0b)}.ring img,.avatar{width:100%;height:100%;object-fit:cover;border-radius:50%}.ring img{border:3px solid var(--bg)}.story span{display:block;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.post{border-bottom:1px solid var(--line);padding-bottom:12px}.posthead{height:55px;display:flex;align-items:center;gap:9px;padding:0 12px}.posthead img{width:36px;height:36px;border-radius:50%;object-fit:cover}.grow{flex:1;min-width:0}.username{font-size:13px;font-weight:800}.sub{font-size:10.5px;color:var(--muted)}.media{width:100%;aspect-ratio:1/1;object-fit:cover;background:#15121a}.postacts{display:flex;align-items:center;gap:14px;padding:9px 12px 2px}.postacts button{font-size:22px}.spacer{flex:1}.likes,.cap,.commentslink,.ptime{padding:3px 13px;font-size:12px}.likes{font-weight:800}.cap{line-height:1.45}.commentslink,.ptime{color:var(--muted)}.ptime{font-size:9px;text-transform:uppercase}.liked{color:#ff4f81}.saved{color:#bda7ff}.section{font-size:19px;font-weight:900;padding:14px;display:flex;justify-content:space-between;align-items:center}.search{margin:12px 13px;height:42px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:0 12px;color:#fff;width:calc(100% - 26px);outline:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.grid img{width:100%;aspect-ratio:1;object-fit:cover;background:#17131c}.reel{height:calc(100dvh - 128px);position:relative;background:#000}.reel>img,.reel>video{width:100%;height:100%;object-fit:cover}.reel:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,#000d);pointer-events:none}.reelinfo{position:absolute;z-index:3;left:13px;right:70px;bottom:22px}.reelside{position:absolute;z-index:3;right:11px;bottom:25px;display:flex;flex-direction:column;gap:17px}.reelside button{color:#fff;border:0;background:transparent;font-size:22px}.profilecover{height:88px;background:radial-gradient(circle at 20% 20%,#8b5cf6 0,transparent 35%),radial-gradient(circle at 80% 20%,#ec4899 0,transparent 31%),#17121e}.prof{padding:0 14px}.profrow{display:flex;align-items:flex-end;justify-content:space-between;margin-top:-38px}.profpic{width:82px;height:82px;border-radius:50%;border:4px solid var(--bg);object-fit:cover;background:#231c2c}.stats{display:flex;gap:17px;margin-bottom:8px}.stat{text-align:center;font-size:10px;color:var(--muted)}.stat b{display:block;color:#fff;font-size:16px}.pname{font-weight:900;margin-top:10px}.handle,.bio,.plink{font-size:12px;margin-top:4px}.handle{color:var(--muted)}.bio{line-height:1.45}.plink{color:#b8a8ff}.profilebtns{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.btn,.secondary{border:0;border-radius:11px;padding:11px;font-weight:800;cursor:pointer}.btn{color:#fff;background:linear-gradient(135deg,var(--p),var(--pink))}.secondary{color:#fff;background:var(--panel2);border:1px solid var(--line)}.activity,.chat,.person{display:flex;gap:10px;align-items:center;padding:10px 13px;border-bottom:1px solid #ffffff06}.activity img,.chat img,.person img{width:46px;height:46px;border-radius:50%;object-fit:cover}.chatbody{flex:1;min-width:0}.small{font-size:11px;color:var(--muted)}.overlay{position:fixed;z-index:100;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center}.overlay.open{display:flex}.sheet{width:min(100%,480px);max-height:90dvh;overflow:auto;background:var(--panel);border-radius:22px 22px 0 0;border:1px solid #2c2636}.sheethead{height:54px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--line)}.sheethead b{flex:1;text-align:center}.form{padding:14px;display:grid;gap:10px}.field{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:11px;color:#fff;padding:12px;outline:0}.preview{width:100%;aspect-ratio:1;border:1px dashed #4a4057;border-radius:13px;display:grid;place-items:center;color:var(--muted);overflow:hidden}.preview img,.preview video{width:100%;height:100%;object-fit:cover}.auth{position:fixed;z-index:200;inset:0;background:radial-gradient(circle at 20% 20%,#2a1747,transparent 34%),radial-gradient(circle at 80% 30%,#4b1837,transparent 30%),#09070d;display:grid;place-items:center;padding:20px}.authcard{width:min(100%,390px);background:#100d16dd;border:1px solid #30283a;border-radius:24px;padding:22px;backdrop-filter:blur(20px)}.authlogo{font-size:40px;font-weight:950;text-align:center;margin-bottom:4px}.authsub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:18px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#19151f;padding:4px;border-radius:12px;margin-bottom:12px}.tabs button{border:0;border-radius:9px;padding:9px;background:transparent;color:#8e8799}.tabs button.on{background:#fff;color:#111}.error{font-size:11px;color:#ff839b;min-height:15px}.toast{position:fixed;z-index:300;left:50%;bottom:85px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 14px;border-radius:99px;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.storyview{position:fixed;z-index:150;inset:0;background:#030204;display:none;justify-content:center}.storyview.open{display:flex}.storycard{width:min(100%,480px);height:100dvh;position:relative}.storycard>img,.storycard>video{width:100%;height:100%;object-fit:cover}.storymeta{position:absolute;top:20px;left:14px;right:14px;display:flex;align-items:center;gap:8px;background:#0004;padding:8px;border-radius:14px}.storymeta img{width:34px;height:34px;border-radius:50%}.storymeta b{flex:1}.storymeta button{color:#fff;background:none;border:0;font-size:25px}.messages{max-height:55dvh;overflow:auto;padding:10px}.bubble{max-width:78%;padding:9px 11px;border-radius:14px;background:#211b2a;margin:6px 0;font-size:12px}.bubble.me{margin-left:auto;background:linear-gradient(135deg,#6d4bd2,#c13d82)}.composer{display:flex;gap:7px;padding:10px;border-top:1px solid var(--line)}.composer input{flex:1}.empty{text-align:center;color:var(--muted);padding:35px 20px;font-size:13px}
</style>
</head>
<body>
<div class="auth" id="auth"><div class="authcard"><div class="authlogo">Flowy</div><div class="authsub">Akışını paylaş. İnsanları keşfet.</div><div class="tabs"><button id="loginTab" class="on">Giriş</button><button id="signupTab">Kayıt</button></div><div class="form" style="padding:0"><input id="displayName" class="field hidden" placeholder="Görünen ad"><input id="username" class="field hidden" placeholder="Kullanıcı adı"><input id="email" class="field" type="email" placeholder="E-posta"><input id="password" class="field" type="password" placeholder="Şifre"><button class="btn" id="authSubmit">Giriş yap</button><div class="error" id="authError"></div></div></div></div>
<div class="app" id="app">
<header class="top"><div class="logo">Flowy</div><div class="icons"><button class="iconbtn" onclick="openNotifications()">♡</button><button class="iconbtn" onclick="go('messages')">✉</button></div></header>
<section class="page active" id="home"><div class="stories" id="stories"></div><div id="feed"></div></section>
<section class="page" id="explore"><div class="section">Keşfet</div><input class="search" id="search" placeholder="Kullanıcı veya içerik ara"><div id="people"></div><div class="grid" id="exploreGrid"></div></section>
<section class="page" id="reels"><div id="reelWrap"></div></section>
<section class="page" id="messages"><div class="section">Mesajlar <button class="plain" onclick="newMessage()">＋</button></div><div id="chatList"></div></section>
<section class="page" id="profile"><div class="profilecover"></div><div class="prof"><div class="profrow"><img id="profPic" class="profpic"><div class="stats"><div class="stat"><b id="postCount">0</b>Gönderi</div><div class="stat"><b id="followerCount">0</b>Takipçi</div><div class="stat"><b id="followingCount">0</b>Takip</div></div></div><div id="profName" class="pname"></div><div id="profHandle" class="handle"></div><div id="profBio" class="bio"></div><div id="profLink" class="plink"></div><div class="profilebtns"><button class="secondary" onclick="editProfile()">Profili düzenle</button><button class="secondary" onclick="logout()">Çıkış</button></div></div><div class="section">Gönderiler</div><div class="grid" id="profileGrid"></div></section>
<nav class="bottom"><button class="nav active" data-page="home">⌂</button><button class="nav" data-page="explore">⌕</button><button class="nav" onclick="openCreate()"><span class="create">＋</span></button><button class="nav" data-page="reels">▶</button><button class="nav" data-page="profile">●</button></nav>
</div>
<div class="overlay" id="createOverlay"><div class="sheet"><div class="sheethead"><button class="plain" onclick="closeOverlay('createOverlay')">✕</button><b>Yeni içerik</b><span></span></div><div class="form"><select id="kind" class="field"><option value="post">Gönderi</option><option value="story">Story</option><option value="reel">Reel</option></select><input id="mediaFile" class="field" type="file" accept="image/*,video/mp4,video/webm"><div class="preview" id="preview">Fotoğraf veya video seç</div><textarea id="caption" class="field" placeholder="Açıklama"></textarea><input id="location" class="field" placeholder="Konum"><button class="btn" onclick="publish()">Paylaş</button></div></div></div>
<div class="overlay" id="commentsOverlay"><div class="sheet"><div class="sheethead"><button class="plain" onclick="closeOverlay('commentsOverlay')">✕</button><b>Yorumlar</b><span></span></div><div id="commentsBox"></div><div class="composer"><input id="commentInput" class="field" placeholder="Yorum yaz"><button class="btn" onclick="sendComment()">Gönder</button></div></div></div>
<div class="overlay" id="notifyOverlay"><div class="sheet"><div class="sheethead"><button class="plain" onclick="closeOverlay('notifyOverlay')">✕</button><b>Bildirimler</b><span></span></div><div id="notifications"></div></div></div>
<div class="overlay" id="editOverlay"><div class="sheet"><div class="sheethead"><button class="plain" onclick="closeOverlay('editOverlay')">✕</button><b>Profili düzenle</b><span></span></div><div class="form"><input id="editName" class="field" placeholder="Ad"><textarea id="editBio" class="field" placeholder="Bio"></textarea><input id="editWebsite" class="field" placeholder="Web sitesi"><input id="editAvatar" class="field" type="file" accept="image/*"><button class="btn" onclick="saveProfile()">Kaydet</button></div></div></div>
<div class="overlay" id="chatOverlay"><div class="sheet"><div class="sheethead"><button class="plain" onclick="closeOverlay('chatOverlay')">✕</button><b id="chatTitle">Sohbet</b><span></span></div><div class="messages" id="messageBox"></div><div class="composer"><input id="messageInput" class="field" placeholder="Mesaj yaz"><button class="btn" onclick="sendMessage()">Gönder</button></div></div></div>
<div class="storyview" id="storyView"><div class="storycard" id="storyCard"></div></div>
<div class="toast" id="toast"></div>
<script>
const SUPABASE_URL='https://kwrfowkhqtsukaasogmg.supabase.co';
const SUPABASE_KEY='sb_publishable_n4rh-p-gTpHL0WSdiTHe2Q_2qn4jCWa';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const fallback='https://api.dicebear.com/9.x/thumbs/svg?seed=';
let me=null, profile=null, currentCommentPost=null, currentConversation=null, signup=false, realtimeChannel=null;
const $=id=>document.getElementById(id); const esc=s=>(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function avatar(p){return p?.avatar_url||fallback+encodeURIComponent(p?.username||'flowy')}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function openOverlay(id){$(id).classList.add('open')} function closeOverlay(id){$(id).classList.remove('open')}
function ago(v){const s=(Date.now()-new Date(v))/1000;if(s<60)return 'az önce';if(s<3600)return Math.floor(s/60)+' dk';if(s<86400)return Math.floor(s/3600)+' sa';return Math.floor(s/86400)+' gün'}
async function init(){const {data:{session}}=await sb.auth.getSession();if(session){me=session.user;await loadMe();$('auth').classList.add('hidden');await refreshAll();subscribe();}else $('auth').classList.remove('hidden')}
$('loginTab').onclick=()=>setAuthMode(false);$('signupTab').onclick=()=>setAuthMode(true);function setAuthMode(v){signup=v;$('loginTab').classList.toggle('on',!v);$('signupTab').classList.toggle('on',v);$('displayName').classList.toggle('hidden',!v);$('username').classList.toggle('hidden',!v);$('authSubmit').textContent=v?'Hesap oluştur':'Giriş yap';$('authError').textContent=''}
$('authSubmit').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6){$('authError').textContent='E-posta ve en az 6 karakter şifre gerekli.';return}let r;if(signup){const username=$('username').value.trim().toLowerCase().replace(/[^a-z0-9_.]/g,'');if(username.length<3){$('authError').textContent='Kullanıcı adı en az 3 karakter olmalı.';return}r=await sb.auth.signUp({email,password,options:{data:{username,display_name:$('displayName').value.trim()||username}}})}else r=await sb.auth.signInWithPassword({email,password});if(r.error){$('authError').textContent=r.error.message;return}if(signup&&!r.data.session){$('authError').style.color='#91f3c6';$('authError').textContent='E-posta doğrulama bağlantısını kontrol et.';return}me=r.data.user;await loadMe();$('auth').classList.add('hidden');await refreshAll();subscribe()}
async function loadMe(){if(!me)return;const {data}=await sb.from('profiles').select('*').eq('id',me.id).single();profile=data}
async function logout(){await sb.auth.signOut();location.reload()}
document.querySelectorAll('.nav[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));async function go(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('.nav[data-page]').forEach(n=>n.classList.toggle('active',n.dataset.page===id));if(id==='explore')await loadExplore();if(id==='reels')await loadReels();if(id==='profile')await loadProfile();if(id==='messages')await loadChats()}
async function refreshAll(){await Promise.all([loadStories(),loadFeed(),loadProfile()])}
async function loadStories(){const {data}=await sb.from('posts').select('id,media_url,created_at,user_id,profiles:user_id(username,display_name,avatar_url)').eq('kind','story').gte('created_at',new Date(Date.now()-86400000).toISOString()).order('created_at',{ascending:false}).limit(30);$('stories').innerHTML=`<div class="story" onclick="openCreate('story')"><div class="ring"><img src="${avatar(profile)}"></div><span>Story ekle</span></div>`+(data||[]).map(x=>`<div class="story" onclick="showStory('${x.id}')"><div class="ring"><img src="${avatar(x.profiles)}"></div><span>${esc(x.profiles?.username)}</span></div>`).join('')}
async function loadFeed(){const {data,error}=await sb.from('posts').select('id,user_id,kind,media_url,caption,location,created_at,profiles:user_id(username,display_name,avatar_url),likes(user_id),comments(id)').eq('kind','post').order('created_at',{ascending:false}).limit(40);if(error){$('feed').innerHTML='<div class="empty">Akış yüklenemedi.</div>';return}$('feed').innerHTML=(data||[]).length?(data||[]).map(postHtml).join(''):'<div class="empty">Henüz gönderi yok. İlk paylaşımı sen yap.</div>'}
function postHtml(p){const liked=(p.likes||[]).some(l=>l.user_id===me?.id);const count=(p.likes||[]).length;return `<article class="post"><div class="posthead"><img src="${avatar(p.profiles)}"><div class="grow"><div class="username">${esc(p.profiles?.username)}</div><div class="sub">${esc(p.location||'Flowy')}</div></div>${p.user_id!==me?.id?`<button class="secondary" style="padding:6px 9px;font-size:10px" onclick="toggleFollow('${p.user_id}',this)">Takip</button>`:''}</div><img class="media" src="${p.media_url}" ondblclick="likePost('${p.id}',this)"><div class="postacts"><button class="plain ${liked?'liked':''}" onclick="likePost('${p.id}',this)">♥</button><button class="plain" onclick="openComments('${p.id}')">○</button><button class="plain" onclick="sharePost('${p.id}')">✈</button><div class="spacer"></div><button class="plain" onclick="savePost('${p.id}',this)">▣</button></div><div class="likes">${count} beğenme</div><div class="cap"><b>${esc(p.profiles?.username)}</b> ${esc(p.caption||'')}</div><div class="commentslink" onclick="openComments('${p.id}')">${(p.comments||[]).length} yorumu gör</div><div class="ptime">${ago(p.created_at)}</div></article>`}
async function likePost(id,btn){const {data}=await sb.from('likes').select('*').eq('post_id',id).eq('user_id',me.id).maybeSingle();if(data){await sb.from('likes').delete().eq('post_id',id).eq('user_id',me.id);btn?.classList.remove('liked')}else{await sb.from('likes').insert({post_id:id,user_id:me.id});btn?.classList.add('liked')}loadFeed()}
async function savePost(id,btn){const {data}=await sb.from('saves').select('*').eq('post_id',id).eq('user_id',me.id).maybeSingle();if(data){await sb.from('saves').delete().eq('post_id',id).eq('user_id',me.id);btn?.classList.remove('saved');toast('Kaydedilenlerden kaldırıldı')}else{await sb.from('saves').insert({post_id:id,user_id:me.id});btn?.classList.add('saved');toast('Kaydedildi')}}
function sharePost(id){const u=location.origin+location.pathname+'#post='+id;navigator.clipboard?.writeText(u);toast('Gönderi bağlantısı kopyalandı')}
async function openComments(id){currentCommentPost=id;openOverlay('commentsOverlay');const {data}=await sb.from('comments').select('id,body,created_at,user_id,profiles:user_id(username,avatar_url)').eq('post_id',id).order('created_at',{ascending:true});$('commentsBox').innerHTML=(data||[]).map(c=>`<div class="activity"><img src="${avatar(c.profiles)}"><div><b style="font-size:12px">${esc(c.profiles?.username)}</b><div style="font-size:12px">${esc(c.body)}</div><div class="small">${ago(c.created_at)}</div></div></div>`).join('')||'<div class="empty">İlk yorumu sen yaz.</div>'}
async function sendComment(){const body=$('commentInput').value.trim();if(!body)return;const {error}=await sb.from('comments').insert({post_id:currentCommentPost,user_id:me.id,body});if(error)return toast(error.message);$('commentInput').value='';await openComments(currentCommentPost);loadFeed()}
async function toggleFollow(uid,btn){const {data}=await sb.from('follows').select('*').eq('follower_id',me.id).eq('following_id',uid).maybeSingle();if(data){await sb.from('follows').delete().eq('follower_id',me.id).eq('following_id',uid);if(btn)btn.textContent='Takip'}else{await sb.from('follows').insert({follower_id:me.id,following_id:uid});if(btn)btn.textContent='Takiptesin'}loadProfile()}
function openCreate(force){if(force)$('kind').value=force;openOverlay('createOverlay')}
$('mediaFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f);$('preview').innerHTML=f.type.startsWith('video/')?`<video src="${u}" controls></video>`:`<img src="${u}">`}
async function upload(file,folder='posts'){const ext=(file.name.split('.').pop()||'bin').toLowerCase();const path=`${me.id}/${folder}/${crypto.randomUUID()}.${ext}`;const {error}=await sb.storage.from('flowy-media').upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;return sb.storage.from('flowy-media').getPublicUrl(path).data.publicUrl}
async function publish(){const file=$('mediaFile').files[0];if(!file)return toast('Dosya seç');try{toast('Yükleniyor...');const kind=$('kind').value,url=await upload(file,kind);const {error}=await sb.from('posts').insert({user_id:me.id,kind,media_url:url,caption:$('caption').value.trim(),location:$('location').value.trim()});if(error)throw error;closeOverlay('createOverlay');$('mediaFile').value='';$('caption').value='';$('location').value='';$('preview').textContent='Fotoğraf veya video seç';toast('Paylaşıldı');await refreshAll();if(kind==='reel')loadReels()}catch(e){toast(e.message)}}
async function loadExplore(q=''){let pq=sb.from('profiles').select('*').neq('id',me.id).limit(12);if(q)pq=pq.or(`username.ilike.%${q}%,display_name.ilike.%${q}%`);const [{data:users},{data:posts}]=await Promise.all([pq,sb.from('posts').select('id,media_url').eq('kind','post').order('created_at',{ascending:false}).limit(60)]);$('people').innerHTML=(users||[]).map(u=>`<div class="person"><img src="${avatar(u)}"><div class="chatbody"><b style="font-size:13px">${esc(u.username)}</b><div class="small">${esc(u.display_name)}</div></div><button class="secondary" style="padding:7px 9px" onclick="startChat('${u.id}','${esc(u.username)}')">Mesaj</button></div>`).join('');$('exploreGrid').innerHTML=(posts||[]).map(p=>`<img src="${p.media_url}">`).join('')}
$('search').oninput=e=>loadExplore(e.target.value.trim());
async function loadReels(){const {data}=await sb.from('posts').select('id,user_id,media_url,caption,created_at,profiles:user_id(username,avatar_url),likes(user_id)').eq('kind','reel').order('created_at',{ascending:false}).limit(20);$('reelWrap').innerHTML=(data||[]).map(r=>`<div class="reel">${/\.(mp4|webm)(\?|$)/i.test(r.media_url)?`<video src="${r.media_url}" autoplay muted loop playsinline controls></video>`:`<img src="${r.media_url}">`}<div class="reelinfo"><b>@${esc(r.profiles?.username)}</b><p>${esc(r.caption||'')}</p></div><div class="reelside"><button onclick="likePost('${r.id}',this)">♥<div class="small">${(r.likes||[]).length}</div></button><button onclick="openComments('${r.id}')">○</button><button onclick="sharePost('${r.id}')">✈</button></div></div>`).join('')||'<div class="empty">Henüz Reel yok.</div>'}
async function loadProfile(){if(!profile)return;const [{data:posts},{count:followers},{count:following}]=await Promise.all([sb.from('posts').select('id,media_url').eq('user_id',me.id).in('kind',['post','reel']).order('created_at',{ascending:false}),sb.from('follows').select('*',{count:'exact',head:true}).eq('following_id',me.id),sb.from('follows').select('*',{count:'exact',head:true}).eq('follower_id',me.id)]);$('profPic').src=avatar(profile);$('profName').textContent=profile.display_name||profile.username;$('profHandle').textContent='@'+profile.username;$('profBio').textContent=profile.bio||'';$('profLink').textContent=profile.website||'';$('postCount').textContent=(posts||[]).length;$('followerCount').textContent=followers||0;$('followingCount').textContent=following||0;$('profileGrid').innerHTML=(posts||[]).map(p=>`<img src="${p.media_url}">`).join('')}
function editProfile(){$('editName').value=profile.display_name||'';$('editBio').value=profile.bio||'';$('editWebsite').value=profile.website||'';openOverlay('editOverlay')}
async function saveProfile(){try{let avatar_url=profile.avatar_url;const f=$('editAvatar').files[0];if(f)avatar_url=await upload(f,'avatars');const {error}=await sb.from('profiles').update({display_name:$('editName').value.trim(),bio:$('editBio').value.trim(),website:$('editWebsite').value.trim(),avatar_url}).eq('id',me.id);if(error)throw error;await loadMe();closeOverlay('editOverlay');loadProfile();toast('Profil güncellendi')}catch(e){toast(e.message)}}
async function showStory(id){const {data}=await sb.from('posts').select('*,profiles:user_id(username,avatar_url)').eq('id',id).single();if(!data)return;const video=/\.(mp4|webm)(\?|$)/i.test(data.media_url);$('storyCard').innerHTML=`${video?`<video src="${data.media_url}" autoplay playsinline controls></video>`:`<img src="${data.media_url}">`}<div class="storymeta"><img src="${avatar(data.profiles)}"><b>${esc(data.profiles?.username)}</b><button onclick="$('storyView').classList.remove('open')">✕</button></div>`;$('storyView').classList.add('open')}
async function openNotifications(){openOverlay('notifyOverlay');const {data}=await sb.from('notifications').select('id,type,created_at,read,actor_id,profiles:actor_id(username,avatar_url)').eq('user_id',me.id).order('created_at',{ascending:false}).limit(50);$('notifications').innerHTML=(data||[]).map(n=>`<div class="activity"><img src="${avatar(n.profiles)}"><div><b>${esc(n.profiles?.username||'Biri')}</b> ${n.type==='like'?'gönderini beğendi':n.type==='comment'?'gönderine yorum yaptı':'seni takip etmeye başladı'}<div class="small">${ago(n.created_at)}</div></div></div>`).join('')||'<div class="empty">Yeni bildirim yok.</div>';await sb.from('notifications').update({read:true}).eq('user_id',me.id).eq('read',false)}
async function loadChats(){const {data,error}=await sb.rpc('get_conversations');$('chatList').innerHTML=error?`<div class="empty">${esc(error.message)}</div>`:(data||[]).map(c=>`<div class="chat" onclick="openChat('${c.conversation_id}','${esc(c.username)}')"><img src="${avatar(c)}"><div class="chatbody"><b style="font-size:13px">${esc(c.username)}</b><div class="small">${esc(c.last_message||'Yeni sohbet')}</div></div></div>`).join('')||'<div class="empty">Henüz mesajın yok.</div>'}
async function newMessage(){go('explore');$('search').focus();toast('Mesaj atmak istediğin kişiyi seç')}
async function startChat(uid,name){const {data,error}=await sb.rpc('start_conversation',{other_user:uid});if(error)return toast(error.message);await openChat(data,name)}
async function openChat(cid,name){currentConversation=cid;$('chatTitle').textContent='@'+name;openOverlay('chatOverlay');await loadMessages();subscribeMessages(cid)}
async function loadMessages(){const {data}=await sb.from('messages').select('id,body,sender_id,created_at').eq('conversation_id',currentConversation).order('created_at',{ascending:true});$('messageBox').innerHTML=(data||[]).map(m=>`<div class="bubble ${m.sender_id===me.id?'me':''}">${esc(m.body)}<div class="small">${ago(m.created_at)}</div></div>`).join('');$('messageBox').scrollTop=$('messageBox').scrollHeight}
async function sendMessage(){const body=$('messageInput').value.trim();if(!body||!currentConversation)return;const {error}=await sb.from('messages').insert({conversation_id:currentConversation,sender_id:me.id,body});if(error)return toast(error.message);$('messageInput').value='';await loadMessages();loadChats()}
function subscribeMessages(cid){sb.channel('chat-'+cid).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+cid},()=>loadMessages()).subscribe()}
function subscribe(){if(realtimeChannel)sb.removeChannel(realtimeChannel);realtimeChannel=sb.channel('flowy-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'posts'},()=>{loadFeed();loadStories();}).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+me.id},()=>toast('Yeni bildirimin var')).subscribe()}
sb.auth.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_OUT')location.reload();if(session&&!me){me=session.user;await loadMe();$('auth').classList.add('hidden');refreshAll();subscribe()}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
init();
</script>
</body></html>
